<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative; display: grid; grid-template-columns: 1.2fr .8fr; gap: 70px; align-items: center; padding: 78px 86px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #281911; background: #FBF8ED; }
  .ember { position: absolute; border-radius: 50%; background: #8C4922; opacity: .05; }
  .kicker { color: #8C4922; font-size: 19px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin: 30px 0 24px; max-width: 690px; font-size: 76px; line-height: .98; letter-spacing: -.06em; }
  p { margin: 0; max-width: 620px; color: #625149; font-size: 26px; line-height: 1.45; }
  .rule { width: 120px; height: 6px; border-radius: 3px; background: #8C4922; margin-top: 34px; }
  .table { position: relative; width: 350px; height: 370px; border: 1px solid rgba(40,25,17,.12); border-radius: 24px; background: #FEFCF6; }
  .glow { position: absolute; left: 50%; top: 68px; transform: translateX(-50%); width: 184px; height: 184px; border-radius: 50%; background: radial-gradient(circle, rgba(209,166,98,.22) 0%, rgba(209,166,98,.14) 58%, rgba(209,166,98,0) 72%); }
  .cord { position: absolute; left: 50%; top: 0; width: 5px; height: 74px; background: #281911; }
  .shade { position: absolute; left: 50%; top: 116px; transform: translateX(-50%); }
  .shelf { position: absolute; left: 46px; right: 46px; bottom: 36px; height: 5px; border-radius: 2.5px; background: rgba(40,25,17,.8); }
  .cup { position: absolute; bottom: 41px; }
  .cup svg { display: block; }
  .c1 { left: 88px; } .c2 { left: 160px; } .c3 { left: 232px; }
  .brand { position: absolute; left: 86px; bottom: 42px; color: rgba(40,25,17,.42); font-size: 17px; font-weight: 700; letter-spacing: .08em; }
</style>
</head>
<body>
  <span class="ember" style="left:120px; top:470px; width:6px; height:6px;"></span>
  <span class="ember" style="left:300px; top:420px; width:5px; height:5px;"></span>
  <span class="ember" style="left:540px; top:495px; width:6px; height:6px;"></span>
  <span class="ember" style="left:660px; top:430px; width:5px; height:5px;"></span>
  <main><div class="kicker">A quiet room with people in it</div><h1>Know Yourself</h1><p>A calm bilingual community for words, assessment results, and image posts.</p><div class="rule"></div></main>
  <aside class="table">
    <div class="glow"></div>
    <div class="cord"></div>
    <svg class="shade" width="72" height="42" viewBox="0 0 72 42" fill="none"><path d="M4 12 Q36 -20 68 12 L60 34 H12 Z" fill="#8C4922"/></svg>
    <div class="shelf"></div>
    <span class="cup c1"><svg width="26" height="30" viewBox="0 0 26 30" fill="none"><rect width="26" height="30" rx="6" fill="#8C4922"/></svg></span>
    <span class="cup c2"><svg width="30" height="34" viewBox="0 0 30 34" fill="none"><rect width="30" height="34" rx="7" fill="#49624E"/></svg></span>
    <span class="cup c3"><svg width="24" height="28" viewBox="0 0 24 28" fill="none"><rect width="24" height="28" rx="6" fill="#904D49"/></svg></span>
  </aside>
  <div class="brand">认识你自己 / KNOW YOURSELF</div>
</body>
</html>
